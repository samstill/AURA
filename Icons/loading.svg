<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1000.0001"
   height="1000.0001"
   viewBox="0 0 264.58335 264.58335"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="magicBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* COLOR THEME LOGIC 
       -----------------
       1. --icon-color defaults to 'currentColor' (inherits from parent text color).
       2. If the OS/Browser is in LIGHT MODE, it forces the color to #fff9f5.
    */
    :root {
      --icon-color: #1a1a1a; /* Default for Dark Mode / Fallback */
    }

    @media (prefers-color-scheme: light) {
      :root {
        --icon-color: #fff9f5; /* Your requested light theme color */
      }
    }

    /* ANIMATION LOGIC
       ---------------
    */
    @keyframes magical-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes aura-breathe {
      0%, 100% { opacity: 0.7; scale: 0.98; }
      50% { opacity: 1; scale: 1.03; }
    }

    /* Outer Ring Styling */
    #path3 {
      fill: var(--icon-color); /* Apply the theme color */
      transform-origin: center;
      transform-box: fill-box;
      filter: url(#magicBlur);
      animation: magical-spin 6s cubic-bezier(0.65, 0, 0.35, 1) infinite, aura-breathe 3s ease-in-out infinite alternate;
    }

    /* Inner Star Styling */
    #path24 {
      fill: var(--icon-color); /* Apply the theme color */
    }
  </style>

