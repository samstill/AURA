name: encresa_aura
description: "AURA - The World's Fastest AI Secretary by Encresa"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management (Riverpod 2.0)
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.2.0

  # Authentication (OAuth2/OIDC)
  flutter_appauth: ^12.0.0
  flutter_secure_storage: ^10.0.0

  # Networking
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  web_socket_channel: ^3.0.3

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # UI
  cupertino_icons: ^1.0.9
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2 # For "Jelly" and "Sacrifice" micro-interactions
  lucide_icons: ^0.257.0 # Clean geometric icons for glassmorphic aesthetic
  flutter_svg: ^2.2.4 # For SVG logo rendering
  webview_flutter: ^4.13.1 # For animated SVG rendering in splash screen

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  path_provider: ^2.1.5 # For persistent cookie storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
