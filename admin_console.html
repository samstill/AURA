<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Skill Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-hover: #22222e;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
            --text-muted: #5a5a6e;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-radius: 99px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title span {
            opacity: 0.6;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Form Elements */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input,
        select,
        textarea {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #9333ea);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            padding: 0.5rem;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 8px;
        }

        /* Tool Grid */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: all 0.2s;
            position: relative;
        }

        .tool-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .tool-card.connected {
            border-color: var(--success);
        }

        .tool-card.connected::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--success);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .tool-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--bg-hover), var(--bg-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .tool-actions {
            display: flex;
            gap: 0.25rem;
        }

        .tool-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .tool-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-clamp: 2;
            overflow: hidden;
        }

        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .tool-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            background: var(--bg-secondary);
            border-radius: 99px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8rem;
        }

        .status-badge.online {
            color: var(--success);
        }

        .status-badge.offline {
            color: var(--text-muted);
        }

        .toggle-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .toggle-btn.connect {
            background: var(--accent);
            color: white;
        }

        .toggle-btn.disconnect {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Logs */
        .logs-panel {
            background: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            max-height: 150px;
            overflow-y: auto;
            color: var(--success);
        }

        .log-entry {
            margin-bottom: 0.25rem;
            opacity: 0.9;
        }

        .log-time {
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .tool-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <h1>Skill Store</h1>
            </div>
            <div class="header-status">
                <div class="status-dot"></div>
                <span id="serverStatus">Connected</span>
            </div>
        </header>

        <!-- Add New Tool Section -->
        <section>
            <div class="section-header">
                <h2 class="section-title">
                    <span>✨</span> Register New Skill
                </h2>
            </div>

            <div class="card">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Skill Name</label>
                        <input type="text" id="toolName" placeholder="e.g., Google Calendar">
                    </div>
                    <div class="form-group">
                        <label>MCP Endpoint</label>
                        <input type="text" id="toolEndpoint" placeholder="e.g., http://localhost:8000">
                    </div>
                    <div class="form-group">
                        <label>Authentication</label>
                        <select id="toolAuth">
                            <option value="none">No Auth Required</option>
                            <option value="api_key">API Key</option>
                            <option value="oauth2">OAuth2</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Description <span style="color: var(--text-muted);">(Tell the AI when to use
                                this)</span></label>
                        <div style="display: flex; gap: 0.5rem;">
                            <textarea id="toolDesc" style="flex: 1;"
                                placeholder="e.g., Manage calendar events and schedules"></textarea>
                            <button class="btn btn-secondary" onclick="enhanceDescription()" id="enhanceBtn"
                                style="height: fit-content; white-space: nowrap;"
                                title="Let AI write a better description">
                                ✨ Enhance
                            </button>
                        </div>
                        <div id="aiSuggestion"
                            style="display: none; margin-top: 0.75rem; padding: 1rem; background: rgba(124, 58, 237, 0.1); border: 1px dashed var(--accent); border-radius: 8px;">
                            <div style="font-size: 0.85rem; color: var(--accent-light); margin-bottom: 0.5rem;">✨ AI
                                Suggestion:</div>
                            <div id="aiSuggestionText" style="font-size: 0.9rem; line-height: 1.5;"></div>
                            <div style="margin-top: 0.75rem; display: flex; gap: 0.5rem;">
                                <button class="btn btn-primary" onclick="acceptSuggestion()"
                                    style="padding: 0.5rem 1rem; font-size: 0.8rem;">Accept</button>
                                <button class="btn btn-secondary" onclick="rejectSuggestion()"
                                    style="padding: 0.5rem 1rem; font-size: 0.8rem;">Dismiss</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="registerTool()">
                    🚀 Deploy Skill
                </button>
            </div>
        </section>

        <!-- Active Skills Section -->
        <section>
            <div class="section-header">
                <h2 class="section-title">
                    <span>🔧</span> Active Skills
                    <span id="toolCount" style="font-weight: 400; font-size: 0.9rem; color: var(--text-muted);"></span>
                </h2>
                <button class="btn btn-secondary btn-icon" onclick="fetchTools()" title="Refresh">
                    ↻
                </button>
            </div>

            <div id="toolGrid" class="tool-grid">
                <!-- Tools rendered here -->
            </div>
        </section>

        <!-- Logs Section -->
        <section style="margin-top: 2rem;">
            <div class="section-header">
                <h2 class="section-title" style="font-size: 0.9rem; color: var(--text-secondary);">
                    System Logs
                </h2>
            </div>
            <div id="logs" class="logs-panel">
                <div class="log-entry">
                    <span class="log-time">[System]</span> Ready.
                </div>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = 'http://localhost:30000/api/v1';
        let currentSuggestion = '';

        // =====================================================================
        // AI DESCRIPTION ENHANCEMENT
        // =====================================================================

        async function enhanceDescription() {
            const name = document.getElementById('toolName').value.trim();
            const desc = document.getElementById('toolDesc').value.trim();

            if (!name) {
                log('⚠️ Please enter a tool name first', 'warn');
                return;
            }

            const btn = document.getElementById('enhanceBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Thinking...';
            log(`✨ Enhancing description for "${name}"...`);

            try {
                const res = await fetch(`${API_BASE}/admin/enhance_prompt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, short_description: desc || 'A useful tool' })
                });

                if (res.ok) {
                    const data = await res.json();
                    currentSuggestion = data.enhanced_description;
                    document.getElementById('aiSuggestionText').textContent = currentSuggestion;
                    document.getElementById('aiSuggestion').style.display = 'block';
                    log('✅ AI generated a suggestion');
                } else {
                    log('❌ Enhancement failed', 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ Enhance';
            }
        }

        function acceptSuggestion() {
            document.getElementById('toolDesc').value = currentSuggestion;
            document.getElementById('aiSuggestion').style.display = 'none';
            log('✅ Suggestion accepted');
        }

        function rejectSuggestion() {
            document.getElementById('aiSuggestion').style.display = 'none';
            log('Suggestion dismissed');
        }

        // =====================================================================
        // TOOL CRUD OPERATIONS
        // =====================================================================

        async function registerTool() {
            const payload = {
                name: document.getElementById('toolName').value.trim(),
                description: document.getElementById('toolDesc').value.trim(),
                mcp_endpoint: document.getElementById('toolEndpoint').value.trim(),
                auth_type: document.getElementById('toolAuth').value
            };

            if (!payload.name || !payload.mcp_endpoint) {
                log('⚠️ Please fill in Name and Endpoint', 'warn');
                return;
            }

            log(`Deploying "${payload.name}"...`);

            try {
                const res = await fetch(`${API_BASE}/admin/tools`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    log(`✅ "${payload.name}" deployed successfully!`);
                    clearForm();
                    fetchTools();
                } else {
                    const err = await res.json();
                    log(`❌ Failed: ${err.detail}`, 'error');
                }
            } catch (e) {
                log(`❌ Network error: ${e.message}`, 'error');
            }
        }

        async function fetchTools() {
            try {
                const res = await fetch(`${API_BASE}/tools`);
                const tools = await res.json();

                if (Array.isArray(tools)) {
                    renderTools(tools);
                    document.getElementById('toolCount').textContent = `(${tools.length})`;
                    log(`Loaded ${tools.length} skills`);
                }
            } catch (e) {
                log(`❌ Failed to fetch tools: ${e.message}`, 'error');
                renderEmptyState();
            }
        }

        async function toggleConnection(id, currentlyEnabled, authType) {
            const newState = !currentlyEnabled;

            // Handle OAuth redirect
            if (newState && authType === 'oauth2') {
                log('🔐 Starting OAuth flow...');
                try {
                    const res = await fetch(`${API_BASE}/tools/${id}/oauth/start`);
                    const data = await res.json();
                    if (data.url) {
                        window.location.href = data.url;
                        return;
                    }
                } catch (e) {
                    log(`❌ OAuth failed: ${e.message}`, 'error');
                    return;
                }
            }

            try {
                const res = await fetch(`${API_BASE}/tools/${id}/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: newState })
                });

                if (res.ok) {
                    log(`${newState ? '🟢 Connected' : '⚪ Disconnected'} tool`);
                    fetchTools();
                }
            } catch (e) {
                log(`❌ Toggle failed: ${e.message}`, 'error');
            }
        }

        async function deleteTool(id, name) {
            if (!confirm(`Delete "${name}"?\n\nThis will remove it from the AI's toolkit.`)) {
                return;
            }

            log(`🗑️ Deleting "${name}"...`);

            try {
                const res = await fetch(`${API_BASE}/admin/tools/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    log(`✅ "${name}" deleted`);
                    fetchTools();
                } else {
                    const err = await res.json();
                    log(`❌ Delete failed: ${err.detail}`, 'error');
                }
            } catch (e) {
                log(`❌ Delete error: ${e.message}`, 'error');
            }
        }

        // =====================================================================
        // UI RENDERING
        // =====================================================================

        function renderTools(tools) {
            const grid = document.getElementById('toolGrid');

            if (tools.length === 0) {
                renderEmptyState();
                return;
            }

            grid.innerHTML = tools.map(t => {
                const isConnected = t.is_enabled;
                const icon = getToolIcon(t.name);

                return `
                    <div class="tool-card ${isConnected ? 'connected' : ''}">
                        <div class="tool-header">
                            <div class="tool-icon">${icon}</div>
                            <div class="tool-actions">
                                <button class="btn btn-danger btn-icon" onclick="deleteTool('${t.id}', '${t.name}')" title="Delete">
                                    🗑️
                                </button>
                            </div>
                        </div>
                        <div class="tool-name">${t.name}</div>
                        <div class="tool-desc">${t.description || 'No description'}</div>
                        <div class="tool-footer">
                            <div class="tool-meta">
                                <span class="badge">${t.auth_type}</span>
                                <span class="status-badge ${isConnected ? 'online' : 'offline'}">
                                    ${isConnected ? '● Connected' : '○ Offline'}
                                </span>
                            </div>
                            <button class="toggle-btn ${isConnected ? 'disconnect' : 'connect'}" 
                                    onclick="toggleConnection('${t.id}', ${isConnected}, '${t.auth_type}')">
                                ${isConnected ? 'Disconnect' : 'Connect'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderEmptyState() {
            document.getElementById('toolGrid').innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div class="empty-state-icon">🔌</div>
                    <h3>No Skills Registered</h3>
                    <p>Deploy your first skill above to get started.</p>
                </div>
            `;
        }

        function getToolIcon(name) {
            const n = name.toLowerCase();
            if (n.includes('github')) return '🐙';
            if (n.includes('calendar') || n.includes('event')) return '📅';
            if (n.includes('mail') || n.includes('email')) return '✉️';
            if (n.includes('slack')) return '💬';
            if (n.includes('weather')) return '🌤️';
            if (n.includes('search') || n.includes('web')) return '🔍';
            if (n.includes('time') || n.includes('clock')) return '🕐';
            if (n.includes('calc')) return '🧮';
            return '🔧';
        }

        function clearForm() {
            document.getElementById('toolName').value = '';
            document.getElementById('toolEndpoint').value = '';
            document.getElementById('toolDesc').value = '';
            document.getElementById('toolAuth').value = 'none';
        }

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ef4444' : type === 'warn' ? '#f59e0b' : '#10b981';

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span style="color: ${color}">${message}</span>`;

            logs.insertBefore(entry, logs.firstChild);
        }

        // =====================================================================
        // INITIALIZATION
        // =====================================================================

        fetchTools();
    </script>
</body>

</html>
