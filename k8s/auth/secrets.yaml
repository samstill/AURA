# =============================================================================
# Authentik Auth - Secrets
# =============================================================================
# WARNING: These are development secrets only!
# For production, use Kubernetes Secrets with proper encryption or
# Google Secret Manager with External Secrets Operator.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: aura-auth
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: project-aura
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: "authentik"
  POSTGRES_PASSWORD: "authentik-dev-password-change-me"
  POSTGRES_DB: "authentik"

  # Authentik secret key (generate with: openssl rand -base64 36)
  AUTHENTIK_SECRET_KEY: "dev-secret-key-change-in-production-use-openssl-rand"

  # PostgreSQL connection for Authentik
  AUTHENTIK_POSTGRESQL__HOST: "authentik-postgres"
  AUTHENTIK_POSTGRESQL__USER: "authentik"
  AUTHENTIK_POSTGRESQL__PASSWORD: "authentik-dev-password-change-me"
  AUTHENTIK_POSTGRESQL__NAME: "authentik"

  # Redis connection for Authentik
  AUTHENTIK_REDIS__HOST: "authentik-redis"
