# =============================================================================
# Authentik Auth - Redis
# =============================================================================
# Redis 7 for Authentik caching and session storage
# Uses PersistentVolumeClaim for session persistence across restarts
# =============================================================================

# PersistentVolumeClaim for Redis data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-redis-pvc
  namespace: aura-auth
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: project-aura
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi # Small storage for cache/sessions

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: aura-auth
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: project-aura
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --appendonly
            - "yes"
            - --dir
            - /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: authentik-redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: aura-auth
  labels:
    app.kubernetes.io/name: authentik-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik-redis
  ports:
    - port: 6379
      targetPort: 6379
