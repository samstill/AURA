# =============================================================================
# Project Aura - Kubernetes Deployment
# =============================================================================
# Production-ready manifest with 512MB RAM limit for 8GB dev machines.
# Secrets are injected from the 'aura-secrets' Secret object.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-backend
  labels:
    app: aura-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-backend
  template:
    metadata:
      labels:
        app: aura-backend
        tier: backend
    spec:
      containers:
        - name: aura-backend
          image: aura-backend  # Skaffold will tag this
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          
          # -------------------------------------------------------------
          # Resource Limits (CRITICAL for 8GB development)
          # -------------------------------------------------------------
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"  # Hard limit - OOM kill if exceeded
              cpu: "500m"
          
          # -------------------------------------------------------------
          # Environment Variables from Secrets
          # -------------------------------------------------------------
          envFrom:
            - secretRef:
                name: aura-secrets
                optional: true  # Allow startup without secrets for initial testing
          
          env:
            - name: ENVIRONMENT
              value: "development"
            - name: LOG_LEVEL
              value: "INFO"
          
          # -------------------------------------------------------------
          # Health Probes
          # -------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      
      # Graceful shutdown
      terminationGracePeriodSeconds: 30
