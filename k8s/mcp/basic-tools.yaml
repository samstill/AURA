apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-basic
  labels:
    app: mcp-basic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-basic
  template:
    metadata:
      labels:
        app: mcp-basic
    spec:
      containers:
        - name: server
          # A simple image that exposes time/math via MCP
          # Using the standard reference implementation
          image: aura-mcp
          imagePullPolicy: IFNotPresent
          command: ["python", "-m", "mcp_server.main"]
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            # Injecting env vars for tools (e.g. GitHub)
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: GOOGLE_API_KEY
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: GITHUB_CLIENT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-basic-svc
spec:
  selector:
    app: mcp-basic
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
