# =============================================================================
# Project Aura - Kubernetes Service
# =============================================================================
# Services for backend access:
# - ClusterIP: Internal cluster communication
# - NodePort: External access for development (physical device testing)
# =============================================================================

# ClusterIP Service (internal access)
apiVersion: v1
kind: Service
metadata:
  name: aura-backend-svc
  labels:
    app: aura-backend
spec:
  type: ClusterIP
  selector:
    app: aura-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# NodePort Service (external access for physical device testing)
apiVersion: v1
kind: Service
metadata:
  name: aura-backend-nodeport
  labels:
    app: aura-backend
spec:
  type: NodePort
  selector:
    app: aura-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
      protocol: TCP
