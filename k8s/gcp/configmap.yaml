# =============================================================================
# Project Aura — Production ConfigMap (Non-Secret Configuration)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-config
  namespace: aura-prod
  labels:
    app.kubernetes.io/name: aura-backend
    app.kubernetes.io/part-of: project-aura
    environment: production
data:
  # Application
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "WARNING"
  BASE_URL: "https://api.encresa.com"
  AURA_ENV: "PROD"

  # CORS — only allow known origins
  CORS_ORIGINS_STR: "https://encresa.com,https://www.encresa.com,https://api.encresa.com"

  # LLM Models (non-secret config)
  GEMINI_FAST_MODEL: "models/gemini-2.5-flash"
  GEMINI_SMART_MODEL: "models/gemini-2.5-flash"
  EMBEDDING_MODEL: "models/text-embedding-004"
  OPENAI_FAST_MODEL: "gpt-5-nano"
  OPENAI_SMART_MODEL: "gpt-5.1"
  STALLER_MODEL: "gpt-5-nano"
  GROQ_FAST_MODEL: "llama-3.1-8b-instant"
  GROQ_SMART_MODEL: "llama-3.3-70b-versatile"
  OPENROUTER_FAST_MODEL: "meta-llama/llama-3-8b-instruct:free"
  OPENROUTER_SMART_MODEL: "deepseek/deepseek-r1e"
  DEEPSEEK_MODEL: "deepseek-chat"

  # Agent Configuration
  AGENT_AUTONOMY: "full"
  AGENT_MAX_ITERATIONS: "10"

  # Aura Routing Algorithm
  AURA_HARD_TIMEOUT: "1.0"
  AURA_GRACE_PERIOD: "0.5"
  AURA_MAX_ASYNC_WAIT: "30.0"
  AURA_CACHE_TTL: "3600"
  AURA_CACHE_SIMILARITY_THRESHOLD: "0.95"

  # Super Memory 3.0
  MEMORY_PROFILE_MAX_WORDS: "2000"
  MEMORY_SUMMARY_MAX_WORDS: "500"
  MEMORY_ARCHIVE_SIMILARITY_THRESHOLD: "0.75"
  MEMORY_PRUNE_AFTER_DAYS: "30"

  # Vector Store
  VECTOR_STORE_PROVIDER: "supabase"

  # TTS
  TTS_MOCK: "false"
  ELEVENLABS_MODEL: "eleven_turbo_v2_5"
  FISH_AUDIO_VOICE_ID: "bf322df2096a46f18c579d0baa36f41d"

  # Authentik URLs (browser-facing)
  AUTHENTIK_URL: "https://auth.encresa.com"
  AUTHENTIK_ISSUER: "https://auth.encresa.com/application/o/aura/"
  # Internal Authentik URL (if running Authentik in-cluster; otherwise use external)
  AUTHENTIK_INTERNAL_URL: "https://auth.encresa.com"
