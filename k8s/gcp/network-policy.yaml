# =============================================================================
# Project Aura — Network Policies
# =============================================================================
# Restrict pod-to-pod communication in aura-prod namespace.
# =============================================================================

# Default: deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: aura-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow Ingress → aura-backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: aura-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aura-backend
  policyTypes:
    - Ingress
  ingress:
    # Allow from GKE Ingress / Load Balancer
    - ports:
        - port: 8000
          protocol: TCP

---
# Allow Ingress → authentik-server (Helm chart labels)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-authentik
  namespace: aura-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    # Allow from GKE Ingress / Load Balancer
    - ports:
        - port: 9000
          protocol: TCP
    # Allow from aura-backend (server-to-server auth)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aura-backend
      ports:
        - port: 9000
          protocol: TCP

---
# Allow authentik → authentik-postgresql (Helm bitnami subchart labels)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-to-postgres
  namespace: aura-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: authentik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: worker
      ports:
        - port: 5432
          protocol: TCP

---
# Allow authentik → redis (Helm bitnami subchart labels)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-to-redis
  namespace: aura-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: authentik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: worker
      ports:
        - port: 6379
          protocol: TCP

---
# Allow aura-backend → MCP server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-mcp
  namespace: aura-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-basic
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aura-backend
      ports:
        - port: 8000
          protocol: TCP
