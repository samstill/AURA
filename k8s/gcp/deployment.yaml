# =============================================================================
# Project Aura — GKE Production Deployment
# =============================================================================
# Production-grade deployment with:
# - Non-root security context
# - Resource limits for Autopilot scheduling
# - Liveness/readiness probes
# - ConfigMap + Secrets injection
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-backend
  namespace: aura-prod
  labels:
    app.kubernetes.io/name: aura-backend
    app.kubernetes.io/part-of: project-aura
    environment: production
spec:
  replicas: 2 # Minimum replicas — HPA manages scaling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero-downtime deploys
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aura-backend
        app.kubernetes.io/part-of: project-aura
        environment: production
    spec:
      # Security: non-root, read-only FS where possible
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: aura-backend
          image: asia-south1-docker.pkg.dev/aura-prod-encresa/aura/aura-backend:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          # Security context per container
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # Resource requests/limits for GKE Autopilot
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "1Gi"
              cpu: "1000m"
              ephemeral-storage: "512Mi"

          # Environment from ConfigMap (non-secret values)
          envFrom:
            - configMapRef:
                name: aura-config
            - secretRef:
                name: aura-secrets

          # Liveness Probe — is the process alive?
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness Probe — ready to accept traffic?
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup Probe — give long startup time for first boot
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30 # 5 * 30 = 150s max startup time

      terminationGracePeriodSeconds: 45
