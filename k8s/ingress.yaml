# =============================================================================
# Project Aura - Kubernetes Ingress
# =============================================================================
# Production ingress rules for external access via NGINX Ingress Controller.
# NOT used in local development (Skaffold uses port-forward instead).
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aura-ingress
  labels:
    app: aura-backend
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    # SSL (uncomment for production)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # TLS Configuration (uncomment for production)
  # tls:
  #   - hosts:
  #       - api.aura.example.com
  #     secretName: aura-tls-secret
  rules:
    - host: api.aura.example.com # Replace with actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aura-backend-svc
                port:
                  number: 8000
