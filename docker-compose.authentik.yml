# =============================================================================
# Authentik Development Docker Compose
# =============================================================================
# This file sets up Authentik for local development with a local PostgreSQL.
# For dev mode, we use a local PostgreSQL container instead of Supabase
# because Authentik 2024+ requires schema creation permissions.
#
# Required env vars:
#   AUTHENTIK_SECRET_KEY (auto-generated by dev.sh if not set)
# =============================================================================

services:
  # Local PostgreSQL for Authentik (dev mode only)
  authentik-postgres:
    image: postgres:16-alpine
    container_name: aura-authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-dev-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - authentik_postgres:/var/lib/postgresql/data

  # Redis for Authentik session/cache
  authentik-redis:
    image: redis:alpine
    container_name: aura-authentik-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - authentik_redis:/data

  # Authentik Server
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12.4
    container_name: aura-authentik-server
    restart: unless-stopped
    command: server
    environment:
      # Local PostgreSQL
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev-password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      # Redis
      AUTHENTIK_REDIS__HOST: authentik-redis
      # Secret key for signing
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      # Development settings
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - authentik_media:/data/media
      - authentik_templates:/templates
      - ./authentik/custom-styles.css:/web/dist/custom.css
      - ./authentik/assets:/web/dist/assets
    ports:
      - "9000:9000"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  # Authentik Worker (background tasks)
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12.4
    container_name: aura-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev-password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - authentik_media:/data/media
      - authentik_templates:/templates
      - ./authentik/custom-styles.css:/web/dist/custom.css
      - ./authentik/assets:/web/dist/assets
      - ./authentik/blueprints:/blueprints
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  # Cloudflare Tunnel (Exposes auth.encresa.com securely)
  authentik-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: aura-authentik-tunnel
    restart: unless-stopped
    dns:             
      - 1.1.1.1
      - 8.8.8.8
    command: tunnel --no-autoupdate run --protocol http2
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNmEwZTljNDhjOGQ0YWUzYTY2ZmVhMzc5ZDRlN2ZhYmMiLCJ0IjoiZGE4MTA4ZWEtYmY2Ny00YzlkLThmYzItOTVjNTA4NWFkMTUwIiwicyI6Ik1qRTVORE0zTldRdE9EazBOUzAwTURaaUxXSmlOVFF0TURGaE5XSXpZMkl3TXpnMSJ9
      - TUNNEL_PROTOCOL=http2
    depends_on:
      - authentik-server

volumes:
  authentik_postgres:
    driver: local
  authentik_redis:
    driver: local
  authentik_media:
    driver: local
  authentik_templates:
    driver: local
