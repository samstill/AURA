# =============================================================================
# Project Aura - Skaffold Configuration
# =============================================================================
# The developer experience engine:
# - Hot-reload Python files without rebuilding Docker images
# - Automatic port-forwarding (localhost:30000 -> pod:8000)
# - Build/Deploy/Watch loop
# =============================================================================

apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: aura-backend

# -----------------------------------------------------------------------------
# Build Configuration
# -----------------------------------------------------------------------------
build:
  # Use local Docker daemon (Minikube's internal Docker)
  local:
    push: false
    useBuildkit: true

  artifacts:
    - image: aura-backend
      context: .
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.py"
            dest: /app
            strip: src/

    - image: aura-mcp
      context: .
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.py"
            dest: /app
            strip: src/

# -----------------------------------------------------------------------------
# Deploy Configuration
# -----------------------------------------------------------------------------
deploy:
  kubectl: {}
  # Note: k8s/auth is NOT managed by Skaffold - deploy separately for persistence

# Manifests for aura
manifests:
  rawYaml:
    - k8s/secrets.yaml
    - k8s/deployment.yaml
    - k8s/service.yaml
    - k8s/mcp/basic-tools.yaml
    - k8s/tts-deployment.yaml

# -----------------------------------------------------------------------------
# Port Forwarding
# -----------------------------------------------------------------------------
# Note: Authentik is accessible via NodePort 30080 (not managed by Skaffold)
portForward:
  - resourceType: service
    resourceName: aura-backend-svc
    namespace: default
    port: 8000
    localPort: 30000

  - resourceType: service
    resourceName: mcp-basic-svc
    namespace: default
    port: 8000
    localPort: 8001

  - resourceType: service
    resourceName: aura-tts-svc
    namespace: default
    port: 5002
    localPort: 5002

# -----------------------------------------------------------------------------
# Development Profiles
# -----------------------------------------------------------------------------
profiles:
  # Colab Development Profile (auto-activates with 'skaffold dev')
  # Uses remote Colab workers via ngrok tunnels
  - name: colab
    activation:
      - command: dev
    deploy:
      kubectl: {}
    manifests:
      rawYaml:
        - k8s/secrets.yaml
        - k8s/deployment.yaml
        - k8s/service.yaml
        - k8s/mcp/basic-tools.yaml
        # TTS runs on Colab, not locally in dev mode

  # Production build profile (no hot-reload, optimized image)
  - name: prod
    build:
      artifacts:
        - image: aura-backend
          docker:
            dockerfile: Dockerfile
            buildArgs:
              ENVIRONMENT: production
    deploy:
      kubectl: {}
    manifests:
      rawYaml:
        - k8s/deployment.yaml
        - k8s/service.yaml
        - k8s/ingress.yaml
        - k8s/tts-deployment.yaml
